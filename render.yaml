services:
  - type: web
    name: medmarket-backend
    env: node
    rootDir: backend
    envVars:
      - key: NODE_VERSION
        value: 22
      # ── Database ──────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      # ── Auth ──────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ── AI — BOTH keys required; Groq is the fallback when Gemini 429s ───
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false          # get free key at console.groq.com
      # ── Cloudinary ────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Redis / BullMQ (optional — queue disabled when absent) ───────────
      - key: REDIS_URL
        sync: false
      # ── App ───────────────────────────────────────────────────────────────
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
    buildCommand: npm install -g pnpm && NODE_ENV=development pnpm install && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
